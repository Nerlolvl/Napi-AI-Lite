# Napi Core Configuration
# Optimized for: 2 CPU / 2 GB RAM / ~100 GB SSD
# Scale values up when upgrading hardware.

# === DNA-limits ===
dna:
  max_message_length: 4000
  max_visible_tokens: 512
  supported_languages:
    - ru
    - en
    - pl
  vision_enabled: false

# === Inference Engine ===
engine:
  # Local GGUF model (llama-cpp-python)
  local:
    enabled: false
    model_path: "./models/napi-2b-q4_k_m.gguf"
    n_ctx: 2048
    n_gpu_layers: 0
    n_threads: 2
    max_tokens: 512
    temperature: 0.55

  # Any OpenAI-compatible provider
  # LM Studio:        base_url: "http://localhost:1234/v1"
  # Ollama:           base_url: "http://localhost:11434/v1"
  # vLLM:             base_url: "http://localhost:8000/v1"
  # Together AI:      base_url: "https://api.together.xyz/v1"
  # Groq:             base_url: "https://api.groq.com/openai/v1"
  # OpenAI:           base_url: "https://api.openai.com/v1"
  provider:
    enabled: true
    api_key_env: "NAPI_API_KEY"
    api_key: ""
    base_url: ""
    chat_model: ""
    teacher_model: ""
    filter_model: ""
    reasoning_model: ""
    vision_model: ""
    timeout_seconds: 90
    max_concurrent: 2
    extra_headers:
      HTTP-Referer: "http://localhost:8000"
      X-Title: "Napi AI"

# === Gatekeeper (prefilter without neural network) ===
gatekeeper:
  max_input_length: 4000
  blocked_patterns:
    - "(?i)(malware|exploit|hack|phishing|credential.theft)"
    - "(?i)(violence|abuse|doxxing)"
  max_vision_question_length: 2000

# === Database ===
storage:
  database_path: "./storage/napi_brain.db"
  max_history_messages: 24
  max_memory_notes: 12
  max_knowledge_chunks: 6
  max_reflected_rules: 8
  note_max_length: 1000

# === Soft Learning (Teacher) ===
soft_learning:
  enabled: true
  min_score_for_revision: 8
  temperatures:
    chat: 0.55
    reasoning: 0.25
    filter: 0.0
    teacher: 0.1
    revision: 0.4
    vision: 0.35

# === Reasoning ===
reasoning:
  enabled: true
  max_context_chars: 12000
  max_tokens: 450

# === Server ===
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  app_name: "Napi"
  # Resource limits for 2-core / 2-GB
  gc_interval_requests: 50