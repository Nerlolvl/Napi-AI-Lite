# ⚡ Napi Core Configuration
# 2 CPU / 2 GB RAM / ~100 GB SSD
# Scale values up when upgrading hardware.

# === ДНК-лимиты ===
dna:
  max_message_length: 4000
  max_visible_tokens: 512
  supported_languages:
    - ru
    - en
    - pl
  vision_enabled: false

# === Движок инференса ===
engine:
  # Локальная GGUF модель (llama-cpp-python)
  local:
    enabled: false
    model_path: "./models/napi-2b-q4_k_m.gguf"
    n_ctx: 2048
    n_gpu_layers: 0
    n_threads: 2
    max_tokens: 512
    temperature: 0.55

  # Любой OpenAI-совместимый провайдер
  # LM Studio:        base_url: "http://localhost:1234/v1"
  # Ollama:           base_url: "http://localhost:11434/v1"
  # vLLM:             base_url: "http://localhost:8000/v1"
  # Together AI:      base_url: "https://api.together.xyz/v1"
  # Groq:             base_url: "https://api.groq.com/openai/v1"
  # OpenAI:           base_url: "https://api.openai.com/v1"
  # Любой другой:     base_url: "https://your-server/v1"
  provider:
    enabled: true
    api_key_env: "NAPI_API_KEY"            # Имя переменной окружения с API-ключом
    base_url: "http://localhost:1234/v1"    # URL провайдера (ОБЯЗАТЕЛЬНО указать свой)
    chat_model: ""                          # ОБЯЗАТЕЛЬНО: модель для чата
    teacher_model: ""                       # ОБЯЗАТЕЛЬНО: модель для оценки ответов
    filter_model: ""                        # ОБЯЗАТЕЛЬНО: модель для фильтрации
    reasoning_model: ""                     # ОБЯЗАТЕЛЬНО: модель для рассуждений
    vision_model: ""                        # ОБЯЗАТЕЛЬНО: модель для зрения (если есть)
    timeout_seconds: 90
    max_concurrent: 2
    # Заголовки для специфичных провайдеров (опционально)
    extra_headers:
      HTTP-Referer: "http://localhost:8000"
      X-Title: "Napi AI"

# === Gatekeeper (префильтрация без нейросети) ===
gatekeeper:
  max_input_length: 4000
  blocked_patterns:
    - "(?i)(malware|exploit|hack|phishing|credential.theft)"
    - "(?i)(violence|abuse|doxxing)"
  max_vision_question_length: 2000

# === База данных ===
storage:
  database_path: "./storage/napi_brain.db"
  max_history_messages: 24
  max_memory_notes: 12
  max_knowledge_chunks: 6
  max_reflected_rules: 8
  note_max_length: 1000

# === Soft Learning (Учитель) ===
soft_learning:
  enabled: true
  min_score_for_revision: 8
  temperatures:
    chat: 0.55
    reasoning: 0.25
    filter: 0.0
    teacher: 0.1
    revision: 0.4
    vision: 0.35

# === Рассуждения ===
reasoning:
  enabled: true
  max_context_chars: 12000
  max_tokens: 450

# === Сервер ===
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  app_name: "Napi"